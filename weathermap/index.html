<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherMap</title>
  
  <!-- Chart.js Library via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .container {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      width: 250px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    #message {
      height: 1.5rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 1rem;
    }

    .chart-container {
      position: relative;
      margin: auto;
      height: 50vh;
      width: 100%;
      max-width: 750px;
      background: #ffffff;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Footer Styling */
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      width: 100%;
      max-width: 800px;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>5-Day Weather Forecast</h1>

    <div class="input-group">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button id="getWeatherBtn">Get Weather</button>
    </div>

    <div id="message"></div>

    <div class="chart-container">
      <canvas id="weatherChart"></canvas>
    </div>
  </div>

  <footer>
    <p>25WHA05R1 Bashirun</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
