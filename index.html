<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Projects</title>
  <style>
    /* CSS Reset & Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Links / Cards List */
    .project-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.05rem;
      box-shadow: var(--shadow);
      transition: all 0.2s ease-in-out;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Arrow icon styling */
    .project-card::after {
      content: '→';
      font-size: 1.2rem;
      color: var(--text-muted);
      transition: transform 0.2s ease-in-out, color 0.2s ease-in-out;
    }

    .project-card:hover::after {
      color: var(--primary);
      transform: translateX(4px);
    }

    /* Footer Styling */
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 600px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>My Web Projects</h1>
      <p>Select a project below to view the application.</p>
    </header>

    <main>
      <nav>
        <ul class="project-list">
          <li>
            <a class="project-card" href="./e-book-management/">
              E-Book Management
            </a>
          </li>
          <li>
            <a class="project-card" href="./e-book-management-bootstrap/">
              E-Book Management (Bootstrap)
            </a>
          </li>
          <li>
            <a class="project-card" href="./javascript_for_exp1%26exp_2/register.html">
              E-Book Management Validation
            </a>
          </li>
          <li>
            <a class="project-card" href="./weathermap/">
              WeatherMap
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </div>

  <footer>
    <p>25WHA05R1 Bashirun</p>
  </footer>

</body>
</html>
