<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Book Store - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">User Registration</h4>
            <a href="login.html" class="btn btn-sm btn-light">Go to Login</a>
          </div>
          <div class="card-body">
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="regUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="regUsername">
                <div class="invalid-feedback" id="usernameError">Username must be at least 3 characters.</div>
              </div>

              <div class="mb-3">
                <label for="regEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="regEmail">
                <div class="invalid-feedback" id="emailError">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="regPassword">
                <div class="invalid-feedback" id="passwordError">Password must be at least 6 characters.</div>
              </div>

              <div class="mb-3">
                <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="regConfirmPassword">
                <div class="invalid-feedback" id="confirmPasswordError">Passwords do not match.</div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
   <footer>
        <p>&copy; 2026 E-Book Management System | 25WH1A05R1</p>
    </footer>

  <script src="script.js"></script>
</body>
</html>
