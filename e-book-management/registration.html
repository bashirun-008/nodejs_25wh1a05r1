<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-book Library - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <div class="c">&#x1F4DA;</div>
            <h2>E-book Library</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main class="center">
        <form class="form" action="#" method="POST">
            <h2>Register</h2>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Full Name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email Address" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Mobile Number" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Address"></textarea>

            <button type="submit">Register</button>

            <p>Already registered? <a href="login.html">Login</a></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 E-Book Management System | Copyright 25WH1A05R1</p>
    </footer>
</body>
</html>
